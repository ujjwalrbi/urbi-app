name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key
        env:
          B64: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=$KP" >> "$GITHUB_ENV"
          fi
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: urbi-apk
          path: app/build/outputs/apk/*/debug/*.apk
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: URPHONSCOP latest
          files: app/build/outputs/apk/pub/debug/*.apk
