<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URPHONSCOP</title>
<style>
:root{--bg:#020a02;--pn:#041a04;--g:#39ff14;--dg:#1c7a0c;--ln:#27b012}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--g);font:14px/1.5 monospace;padding:14px 12px 30px;max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0;letter-spacing:1px;text-shadow:0 0 12px rgba(57,255,20,.6)}
.sb{font-size:12px}
.run{height:3px;margin:10px 0 4px;background:linear-gradient(90deg,transparent,var(--g),transparent) -50% 0/40% 100% no-repeat,var(--dg);animation:r 2.6s linear infinite}
@keyframes r{to{background-position:150% 0,0 0}}
.p{position:relative;border:1px solid var(--ln);background:var(--pn);margin:22px 0 14px;padding:16px 12px 12px;box-shadow:0 0 14px rgba(57,255,20,.18),inset 0 0 18px rgba(57,255,20,.06)}
.p h3{position:absolute;top:-10px;left:12px;margin:0;background:var(--bg);padding:0 8px;font-size:12px;letter-spacing:1px}
.big{font-size:30px;font-weight:bold}
.bar{height:10px;border:1px solid var(--ln);margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--g);box-shadow:0 0 8px var(--g);transition:width 1s}
.kv{display:grid;grid-template-columns:120px 1fr;gap:2px 8px;font-size:13px}
.tip{margin-top:10px;border-top:1px dashed var(--ln);padding-top:8px}
button{background:none;color:var(--g);border:1px solid var(--g);padding:8px 14px;font:inherit}
</style></head>
<body>
<h1>URPHONSCOP ∞</h1><div class="sb">UR PHONE SCOPE • PHONE KA POORA HAAL</div><div class="run"></div>
<section class="p"><h3>BATTERY</h3><div class="big" id="bp">--</div><div class="bar"><i id="bb" style="width:0"></i></div><div class="kv" id="bk"></div><div class="tip" id="bt"></div></section>
<section class="p"><h3>STORAGE</h3><div class="big" id="sp">--</div><div class="bar"><i id="sb" style="width:0"></i></div><div class="kv" id="sk"></div><div class="tip" id="st"></div></section>
<section class="p"><h3>RAM</h3><div class="big" id="rp">--</div><div class="bar"><i id="rb" style="width:0"></i></div><div class="kv" id="rk"></div><div class="tip" id="rt"></div></section>
<section class="p"><h3>DEVICE</h3><div class="kv" id="dk"></div></section>
<section class="p"><h3>JALDI AAYEGA</h3>Apps ki permissions ki jaanch, suspicious apps, faltu files.</section>
<button onclick="load()">Refresh</button>
<script>
var ST={2:'Charge ho rahi hai',3:'Use ho rahi hai',4:'Charge nahi ho rahi',5:'Full'};
var HE={2:'Achhi',3:'Overheat',4:'Kharab',5:'Over voltage',7:'Thandi'};
function gb(n){return (n/1073741824).toFixed(1)+' GB'}
function row(a,b){return '<span>'+a+'</span><span>'+b+'</span>'}
function set(id,h){document.getElementById(id).innerHTML=h}
function bar(id,p){document.getElementById(id).style.width=Math.max(0,Math.min(100,p))+'%'}
function load(){
var d;
try{d=JSON.parse(window.URP.info())}catch(e){d={bat:50,temp:30,volt:4000,status:3,health:2,stoT:256e9,stoF:100e9,ramT:8e9,ramF:3e9,model:'Demo (browser)',andr:'?'}}
set('bp',d.bat+'%');bar('bb',d.bat);
var k=row('Status',ST[d.status]||'?')+row('Garmi',d.temp+' °C')+row('Voltage',(d.volt/1000).toFixed(2)+' V')+row('Health',HE[d.health]||'?');
if(d.cycles>0)k+=row('Cycles',d.cycles);
set('bk',k);
var t='Battery theek hai.';
if(d.temp>=40||d.health==3)t='Phone garam hai ('+d.temp+' °C). Charging band karo aur cover hata do.';
else if(d.bat<=20&&d.status!=2)t='Battery kam hai, charge lagao.';
else if(d.bat>=80&&d.status==2)t='80% ho gaya. Battery ki umar ke liye ab charger nikal sakte ho.';
set('bt',t);
var su=d.stoT-d.stoF,sp=Math.round(su*100/d.stoT);
set('sp',sp+'% bhara');bar('sb',sp);
set('sk',row('Total',gb(d.stoT))+row('Use hua',gb(su))+row('Khali',gb(d.stoF)));
set('st',sp>=90?'Storage bahut bhara hai. Bade videos, purani files aur kam use ki apps hatao.':sp>=75?'Storage kaafi bhara hai, thodi safai karo.':'Storage theek hai.');
var ru=d.ramT-d.ramF,rp=Math.round(ru*100/d.ramT);
set('rp',rp+'% use');bar('rb',rp);
set('rk',row('Total',gb(d.ramT))+row('Use hua',gb(ru))+row('Khali',gb(d.ramF)));
set('rt',rp>=85?'RAM bhari hai. Bhaari apps band karo.':'RAM theek hai.');
set('dk',row('Phone',d.model)+row('Android',d.andr));
}
load();setInterval(load,5000);
</script></body></html>
