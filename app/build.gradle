plugins { id 'com.android.application' }
android {
    namespace 'com.urbi.app'
    compileSdk 34
    signingConfigs {
        rel {
            if (System.getenv("KS_FILE")) {
                storeFile file(System.getenv("KS_FILE"))
                storePassword System.getenv("KS_PASS")
                keyAlias 'urbi'
                keyPassword System.getenv("KS_PASS")
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv("KS_FILE")) { signingConfig signingConfigs.rel }
        }
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'ed'
    productFlavors {
        mine { dimension 'ed'; applicationId 'com.urphonscop.owner'; resValue 'string', 'app_name', 'URPHONSCOP Owner'; buildConfigField 'String', 'EDITION', '"mine"' }
        pub { dimension 'ed'; applicationId 'com.urphonscop.app'; resValue 'string', 'app_name', 'URPHONSCOP'; buildConfigField 'String', 'EDITION', '"pub"' }
    }
    defaultConfig {
        applicationId 'com.urphonscop.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }
}
